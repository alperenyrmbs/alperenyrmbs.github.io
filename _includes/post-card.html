<article class="post-card" data-post-card data-search="{{ include.post.title | append: ' ' | append: include.post.description | append: ' ' | append: include.post.tags | downcase | escape }}">
<p class="post-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%B %-d, %Y' }}</time></p>
<h2><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h2>
<p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 180 | escape }}</p>
<a class="textlink small" href="{{ include.post.url | relative_url }}">Read post →</a>
</article>
