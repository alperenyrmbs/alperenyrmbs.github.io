<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AlperenYRMBS — Yakında</title>
  <meta name="description" content="AlperenYRMBS web sitesi yakında yayında." />
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#101a33;
      --card:rgba(255,255,255,.06);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --line:rgba(255,255,255,.12);
      --accent:#7aa2ff;
      --accent2:#8bffdc;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1000px 700px at 20% 20%, rgba(122,162,255,.25), transparent 60%),
        radial-gradient(900px 700px at 80% 80%, rgba(139,255,220,.16), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
    }
    .wrap{max-width:760px;width:100%}
    .card{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:18px;
      padding:28px;
      backdrop-filter: blur(10px);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .logo{
      width:44px;height:44px;border-radius:12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow:0 10px 25px rgba(122,162,255,.25);
    }
    h1{margin:0;font-size:20px;letter-spacing:.2px}
    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      color:var(--muted);
      font-size:13px;
      white-space:nowrap;
    }
    .hero{
      margin:10px 0 14px;
      font-size:34px;
      line-height:1.1;
      letter-spacing:-.6px;
    }
    p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
    .row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:18px;
    }
    a.btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      text-decoration:none;
      color:var(--text);
      background: rgba(255,255,255,.04);
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      font-size:14px;
    }
    a.btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.22);
    }
    .btn.primary{
      border-color: rgba(122,162,255,.45);
      background: rgba(122,162,255,.14);
    }
    .footer{
      margin-top:18px;
      padding-top:14px;
      border-top:1px dashed var(--line);
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:12px;
    }
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="top">
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <h1>AlperenYRMBS</h1>
            <div class="pill">alperenyrmbs.github.io</div>
          </div>
        </div>
        <div class="pill">🚧 Hazırlanıyor</div>
      </div>

      <div class="hero">Site yakında yayında.</div>
      <p>
        Şu an düzenleme aşamasındayım. Çok yakında burada projelerimi, linklerimi ve içerikleri göreceksin.
      </p>

      <div class="row">
        <a class="btn primary" href="https://github.com/alperenyrmbs" target="_blank" rel="noreferrer">
          GitHub Profili
        </a>
        <a class="btn" href="mailto:alperenyrmbs@gmail.com">
          İletişim
        </a>
      </div>

      <div class="footer">
        <div>© <span id="y"></span> AlperenYRMBS</div>
        <div class="mono">v0.1 • coming soon</div>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
